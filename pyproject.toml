[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-automation"
version = "0.1.0"
description = "Screen-driven desktop automation flows with shared safety controls."
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "mss>=9.0.1",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "PyAutoGUI>=0.9.54",
    "pynput>=1.7.6",
    "onnxruntime>=1.23",
    "rapidocr>=3.9,<4",
    "PyGetWindow>=0.0.9; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
